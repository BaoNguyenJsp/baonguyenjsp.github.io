<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Món Quà Bí Ẩn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/style.css">
</head>
<body class="game">
  <header>
    <h1>🎁 Món Quà Bí Ẩn</h1>
    <div class="header-btns">
      <button id="btn-ranking" class="btn big">🏆 Xếp hạng</button>
      <a class="btn big" href="/admin">⚙️ Quản lý</a>
    </div>
  </header>

  <main id="game-main">
    <section id="gift-stage">
      <video id="gift-video" src="/public/Background.mp4" autoplay muted loop playsinline preload="auto"></video>
      <div id="gift-cover"></div>
      <div id="gift-pct" class="big">0%</div>
    </section>

    <aside id="side-panel">
      <p id="round-label" class="big"></p>
      <button id="btn-start-round" class="btn-quest big">🚀 Bắt đầu tuần</button>
      <div id="quest-panel" hidden>
        <div id="quest-buttons"></div>
      </div>
    </aside>
  </main>

  <div id="pts-float"></div>

  <div id="modal-player" class="modal" hidden>
    <div class="modal-box">
      <h2 class="big">Ai hoàn thành nhiệm vụ?</h2>
      <div id="player-grid" class="grid"></div>
      <div class="modal-actions">
        <span id="sel-count" class="big">Đã chọn: 0</span>
        <button id="btn-confirm" class="btn big">Xác nhận</button>
      </div>
    </div>
  </div>

  <div id="modal-celebrate" class="modal celebrate" hidden>
    <div class="modal-box">
      <h1 class="big" id="celebrate-title">🎉 CHÚC MỪNG! 🎉</h1>
      <h2 class="big" id="celebrate-msg"></h2>
    </div>
  </div>

  <div id="modal-ranking" class="modal ranking" hidden>
    <div class="modal-box ranking-box">
      <h2 class="big">🏆 Xếp hạng</h2>
      <table class="big" id="ranking-top">
        <thead><tr><th>Hạng</th><th>Tên</th><th>Điểm</th></tr></thead>
        <tbody id="ranking-top-body"></tbody>
      </table>
      <div class="table-wrap" id="ranking-scroll-wrap">
        <table class="big">
          <thead><tr><th>Hạng</th><th>Tên</th><th>Điểm</th></tr></thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button id="btn-close-ranking" class="btn big">Đóng</button>
      </div>
    </div>
  </div>

  <div id="confetti-layer"></div>

  <script src="/public/app.js"></script>
</body>
</html>
